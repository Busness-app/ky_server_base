name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  go:
    name: Go build, vet & tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...

      - name: Tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  postgres:
    name: Go tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same suite, real Postgres: each test gets its own schema (internal/testdb).
      - name: Tests against PostgreSQL
        env:
          KY_TEST_POSTGRES_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test?sslmode=disable
        run: go test -race -count=1 ./...

  web:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Typecheck and build
        run: npm run build
        working-directory: web

      # web/dist is embedded into the Go binary, so a stale commit ships a stale UI.
      - name: Committed web/dist matches source
        run: git diff --exit-code -- web/dist

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: web

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: shellcheck scripts/*.sh
      - run: go build -o ky_server_base ./cmd/server
      - run: scripts/smoke-test.sh

  docker:
    name: Docker image build & run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ky_server_base:ci .

      - name: Container serves the app
        run: |
          docker run -d --name ky_ci -p 18080:8080 \
            -e KY_ADMIN_PASSWORD='CiSmokeAdminPass123!' \
            -e KY_CAPTCHA_PROVIDER=none \
            ky_server_base:ci
          trap 'docker logs ky_ci; docker rm -f ky_ci' EXIT

          curl -sf -o /dev/null --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18080/
          curl -sf -o /dev/null http://127.0.0.1:18080/api/settings
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"CiSmokeAdminPass123!"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"authenticated":true'
