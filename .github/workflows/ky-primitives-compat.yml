# Early warning, not a merge gate.
#
# This is the first workflow in this repository, and it is deliberately narrow: it does not
# vet this repository's own code. It answers one question -- "the next time we bump
# ky-primitives, will it break us?" -- by building against the library's default branch
# rather than the version pinned in go.mod. General CI for this repository is a separate
# decision; note that the tree is not currently gofmt-clean, so a format gate added here
# would be red on arrival.
#
# It deliberately does not run on pull requests. A failure here is caused by a change in
# another repository, so gating PRs on it would block work that has nothing to do with it.
name: ky-primitives compatibility (early warning)

on:
  schedule:
    - cron: '51 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: Build against ky-primitives default branch
    runs-on: ubuntu-latest
    steps:
      # Both checkouts use persist-credentials: false -- nothing after this runs git
      # against a remote, so leaving an auth header in .git/config would only widen what
      # the build and test steps below can read. This repository is private and
      # ky-primitives is public, so reading the library needs no repository secret; this
      # workflow references none. That direction is the reason the check lives here rather
      # than in ky-primitives, where reaching this repository did need one.
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: consumer
          persist-credentials: false

      - name: Check out ky-primitives default branch
        uses: actions/checkout@v7
        with:
          repository: Busness-app/ky-primitives
          path: ky-primitives
          persist-credentials: false

      # No cache. This job runs go test on an unreviewed default branch of another
      # repository, and setup-go's post-step would save the module and build caches that
      # code wrote into the default-branch scope every push and pull_request job of ci.yml
      # restores from. A job running unreviewed code does not share a cache namespace with
      # a merge gate; it runs once a day and can build cold.
      - uses: actions/setup-go@v7
        with:
          go-version-file: consumer/go.mod
          cache: false

      - name: Point this repository at that checkout
        working-directory: consumer
        run: go mod edit -replace github.com/Busness-app/ky-primitives=../ky-primitives

      - name: Build
        working-directory: consumer
        run: go build ./...

      - name: Test
        working-directory: consumer
        run: go test -count=1 ./...

      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::EARLY WARNING, NOT A MERGE GATE. Your pull request did not cause this. ky_server_base no longer builds or tests against the ky-primitives default branch, so the next version bump will break it. Fix it here, or in ky-primitives, before that bump -- no branch in this repository is blocked in the meantime."
